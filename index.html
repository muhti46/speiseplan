<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <!-- iOS Safari respektiert das Web-App-Manifest (display: standalone) nicht von
         selbst - ohne diese Apple-eigenen Meta-Tags öffnet "Zum Home-Bildschirm" die
         App weiterhin mit Safari-Browserleiste statt im Vollbild-App-Modus. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Speiseplan" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Kinderheim Speiseplan</title>
    <script>
      // Chromes "Desktop-Website"-Modus ignoriert den viewport-Meta-Tag und rendert mit
      // ~980px Breite (winzig, Desktop-Layout) - auch in installierten Apps. Erkennen
      // (Touch-Gerät, Layout viel breiter als der Bildschirm) und per Zoom auf die echte
      // Bildschirmbreite zurückskalieren; html.force-mobile schaltet `sm:`-Styles ab.
      (function () {
        function fit() {
          var d = document.documentElement;
          var sw = window.screen ? window.screen.width : 0;
          d.style.zoom = '';
          var iw = window.innerWidth;
          if (navigator.maxTouchPoints > 0 && sw > 0 && sw < 700 && iw > sw * 1.3) {
            var z = iw / sw;
            d.classList.add('force-mobile');
            d.style.zoom = String(z);
            // vh-Einheiten würden mitgezoomt - daher die sichtbare Höhe explizit setzen.
            d.style.setProperty('--app-height', window.innerHeight / z + 'px');
          } else {
            d.classList.remove('force-mobile');
            d.style.removeProperty('--app-height');
          }
        }
        fit();
        window.addEventListener('resize', fit);
      })();
    </script>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
